name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o '*.zip' -d project
      - name: Fix app build file
        run: |
          cat > project/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.autocallpro"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.autocallpro"
                  minSdk = 26
                  targetSdk = 28
                  versionCode = 1
                  versionName = "0.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF
      - name: Fix manifest
        run: |
          cat > project/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <application
                  android:allowBackup="false"
                  android:label="AutoCall Pro"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.DIAL" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.DIAL" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="tel" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="tel" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AutoCallInCallService"
                      android:permission="android.permission.BIND_INCALL_SERVICE"
                      android:exported="true">
                      <meta-data android:name="android.telecom.IN_CALL_SERVICE_UI" android:value="true" />
                      <meta-data android:name="android.telecom.IN_CALL_SERVICE_RINGING" android:value="true" />
                      <intent-filter>
                          <action android:name="android.telecom.InCallService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
      - name: Fix Kotlin files
        run: |
          D=project/app/src/main/java/com/example/autocallpro
          sed -i 's/singleLine = true/isSingleLine = true/' $D/MainActivity.kt
          sed -i 's/catch (_: Exception)/catch (e: Exception)/' $D/AutoCallInCallService.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCallPro-APK
          path: project/app/build/outputs/apk/debug/*.apk
